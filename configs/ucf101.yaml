dataset: ucf101
root: datasets/raw/UCF-101
split_dir: datasets/raw/ucfTrainTestlist

input_len: 10
pred_len: 10
height: 64
width: 64
channels: 3

model:
  enc_c1: 32
  enc_c2: 64
  enc_c3: 128
  feat_channels: 64
  kernel_size: 3

training:
  epochs: 60
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  max_grad_norm: 1.0
  num_workers: 0
  early_stopping_patience: 12
  seed: 42
  loss_kind: composite
  loss_warmup_epochs: 8

max_videos_per_split: null

output_dir: outputs/ucf101